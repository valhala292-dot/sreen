<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SN Chat</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>
  :root{
    --bg:#131314;
    --sidebar:#1a1b1c;
    --panel:#1e1f20;
    --panel-2:#282a2c;
    --panel-3:#333537;
    --border:#3c4043;
    --text:#e3e3e3;
    --text-dim:#9aa0a6;
    --blue:#4285f4;
    --purple:#a142f4;
    --red:#ea4335;
    --yellow:#fbbc05;
    --grad: linear-gradient(90deg,#4285f4 0%,#a142f4 45%,#ea4335 75%,#fbbc05 100%);
    --radius:20px;
    --sidebar-w: 280px;
    --sidebar-w-collapsed: 76px;
    --ease: cubic-bezier(.2,.7,.3,1);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Google Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  /* ================= App shell ================= */
  #app{
    display:flex;
    height:100%;
    width:100%;
  }

  /* ================= Sidebar (Gemini style) ================= */
  #sidebar{
    width:var(--sidebar-w);
    flex-shrink:0;
    background:var(--sidebar);
    display:flex;
    flex-direction:column;
    padding:12px 12px 10px;
    transition:width .28s var(--ease);
    overflow:hidden;
    position:relative;
    z-index:20;
  }
  #sidebar.collapsed{ width:var(--sidebar-w-collapsed); }

  .sb-top{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 4px 18px;
  }
  .hamburger{
    width:40px;height:40px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
    cursor:pointer;
    flex-shrink:0;
    transition:background .15s ease, transform .3s var(--ease);
    position:relative;
  }
  .hamburger:hover{ background:var(--panel-2); }
  .hamburger:active{ transform:scale(.9); }
  .hamburger i{ transition:transform .35s var(--ease); }
  #sidebar.collapsed .hamburger i{ transform:rotate(180deg); }

  .sb-brand{
    font-size:18px;
    font-weight:600;
    background:var(--grad);
    background-size:300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    white-space:nowrap;
    animation:gradientShift 8s ease infinite;
    opacity:1;
    transition:opacity .15s ease;
  }
  #sidebar.collapsed .sb-brand{ opacity:0; width:0; }
  @keyframes gradientShift{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }

  .newchat-btn{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--panel-2);
    border:1px solid transparent;
    color:var(--text);
    border-radius:20px;
    padding:11px 18px 11px 16px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    width:fit-content;
    max-width:100%;
    margin:2px 2px 22px;
    transition:background .2s ease, box-shadow .2s ease, width .28s var(--ease), padding .28s var(--ease);
    position:relative;
    overflow:hidden;
    white-space:nowrap;
  }
  .newchat-btn:hover{ background:var(--panel-3); box-shadow:0 1px 3px rgba(0,0,0,.4); }
  .newchat-btn span{ transition:opacity .15s ease, width .15s ease; }
  #sidebar.collapsed .newchat-btn{ width:44px; padding:11px; justify-content:center; border-radius:50%; }
  #sidebar.collapsed .newchat-btn span{ display:none; }
  .newchat-btn i{ font-size:16px; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; flex-shrink:0; }

  /* ripple */
  .ripple{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.25);
    transform:scale(0);
    animation:rippleAnim .55s ease-out;
    pointer-events:none;
  }
  @keyframes rippleAnim{
    to{ transform:scale(3); opacity:0; }
  }

  .sb-section-label{
    font-size:12px;
    color:var(--text-dim);
    font-weight:500;
    padding:8px 12px 6px;
    white-space:nowrap;
    opacity:1;
    transition:opacity .15s ease;
  }
  #sidebar.collapsed .sb-section-label{ opacity:0; height:0; padding:0; overflow:hidden; }

  #chatList{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
    gap:1px;
  }
  #sidebar.collapsed #chatList{ overflow:visible; }

  .chat-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:9px 12px;
    border-radius:16px;
    color:var(--text-dim);
    cursor:pointer;
    font-size:13.5px;
    white-space:nowrap;
    overflow:hidden;
    position:relative;
    transition:background .15s ease, color .15s ease;
    animation:itemIn .3s var(--ease) both;
  }
  @keyframes itemIn{
    from{ opacity:0; transform:translateX(-8px); }
    to{ opacity:1; transform:translateX(0); }
  }
  .chat-item:hover{ background:var(--panel-2); color:var(--text); }
  .chat-item.active{ background:var(--panel-2); color:var(--text); }
  .chat-item i.bi-chat-left-text{ flex-shrink:0; font-size:15px; }
  .chat-item .title{ overflow:hidden; text-overflow:ellipsis; flex:1; }
  .chat-item .del{
    opacity:0;
    background:none;border:none;color:var(--text-dim);
    padding:2px 4px;border-radius:6px;flex-shrink:0;
    transition:opacity .15s ease, color .15s ease, background .15s ease;
  }
  .chat-item:hover .del{ opacity:1; }
  .chat-item .del:hover{ color:var(--red); background:rgba(234,67,53,.12); }
  #sidebar.collapsed .chat-item{ justify-content:center; padding:9px; }
  #sidebar.collapsed .chat-item .title,
  #sidebar.collapsed .chat-item .del{ display:none; }

  .sb-bottom{
    border-top:1px solid var(--border);
    padding-top:8px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .sb-link{
    display:flex;
    align-items:center;
    gap:14px;
    padding:10px 12px;
    border-radius:16px;
    color:var(--text-dim);
    font-size:13.5px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
    white-space:nowrap;
    overflow:hidden;
  }
  .sb-link:hover{ background:var(--panel-2); color:var(--text); }
  #sidebar.collapsed .sb-link span{ display:none; }
  #sidebar.collapsed .sb-link{ justify-content:center; }

  /* mobile overlay */
  #sidebarOverlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,.5);
    z-index:15;
    opacity:0;
    transition:opacity .25s ease;
  }
  #sidebarOverlay.show{ display:block; opacity:1; }

  @media (max-width: 860px){
    #sidebar{
      position:fixed; top:0; left:0; bottom:0;
      transform:translateX(-100%);
      transition:transform .3s var(--ease);
      width:280px !important;
      box-shadow:2px 0 24px rgba(0,0,0,.5);
    }
    #sidebar.mobile-open{ transform:translateX(0); }
    #sidebar.collapsed .sb-brand,
    #sidebar.collapsed .newchat-btn span,
    #sidebar.collapsed .sb-section-label,
    #sidebar.collapsed .chat-item .title,
    #sidebar.collapsed .sb-link span{ opacity:1 !important; display:flex !important; }
  }

  /* ================= Main column ================= */
  #main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    height:100%;
    position:relative;
  }

  header{
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
  }
  .header-left{ display:flex; align-items:center; gap:10px; }
  .header-hamburger{
    display:none;
    width:38px;height:38px;
    border-radius:50%;
    border:none;background:transparent;color:var(--text);
    align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .15s ease;
  }
  .header-hamburger:hover{ background:var(--panel-2); }
  @media (max-width: 860px){ .header-hamburger{ display:flex; } }

  .logo{
    font-size:20px;
    font-weight:700;
    background:var(--grad);
    background-size:300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing:-0.01em;
    animation:gradientShift 8s ease infinite;
  }
  .model-pill{
    font-size:12px;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--border);
    padding:5px 12px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:6px;
    transition:border-color .2s ease;
  }
  .model-pill:hover{ border-color:var(--blue); }
  .model-pill .live-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--blue);
    box-shadow:0 0 6px var(--blue);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1; transform:scale(1);}
    50%{opacity:.4; transform:scale(0.7);}
  }

  /* ---------- Chat area ---------- */
  #chat{
    flex:1;
    overflow-y:auto;
    padding:28px 18vw 20px;
    display:flex;
    flex-direction:column;
    gap:2px;
    scroll-behavior:smooth;
    mask-image:linear-gradient(to bottom, transparent 0, #000 24px, #000 calc(100% - 8px), transparent 100%);
  }
  @media (max-width: 1100px){ #chat{ padding:22px 6vw 16px; } }
  @media (max-width: 640px){ #chat{ padding:16px 12px 12px; } }

  .empty-state{
    margin:auto;
    text-align:center;
    max-width:460px;
    animation:fadeUp .6s var(--ease);
  }
  .empty-state .glyph{
    font-size:42px;
    font-weight:700;
    background:var(--grad);
    background-size:300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:10px;
    animation:gradientShift 6s ease infinite;
  }
  .empty-state p{
    font-size:14px;
    color:var(--text-dim);
    line-height:1.6;
  }
  .suggest-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:22px;
  }
  .suggest-chip{
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text-dim);
    padding:9px 16px;
    border-radius:14px;
    font-size:12.5px;
    cursor:pointer;
    transition:transform .18s var(--ease), border-color .18s ease, color .18s ease;
    animation:fadeUp .5s var(--ease) both;
  }
  .suggest-chip:nth-child(1){ animation-delay:.05s; }
  .suggest-chip:nth-child(2){ animation-delay:.12s; }
  .suggest-chip:nth-child(3){ animation-delay:.19s; }
  .suggest-chip:nth-child(4){ animation-delay:.26s; }
  .suggest-chip:hover{ transform:translateY(-2px); border-color:var(--blue); color:var(--text); }

  .row{
    display:flex;
    gap:12px;
    padding:14px 4px;
    animation:fadeUp .4s var(--ease);
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .row.user{ justify-content:flex-end; }
  .row.assistant{ justify-content:flex-start; }

  .avatar{
    width:28px;height:28px;
    border-radius:50%;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
    font-weight:700;
    margin-top:2px;
    transition:transform .25s var(--ease);
  }
  .row.assistant:hover .avatar.ai{ transform:scale(1.08) rotate(-4deg); }
  .avatar.ai{
    background:var(--grad);
    background-size:300% 100%;
    color:#0b0b0c;
    animation:gradientShift 6s ease infinite;
  }
  .avatar.you{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text-dim);
  }

  .bubble{
    max-width:72ch;
    padding:12px 16px;
    border-radius:var(--radius);
    line-height:1.65;
    font-size:15px;
    white-space:pre-wrap;
    word-wrap:break-word;
    contain:content;
    transition:background .2s ease, box-shadow .2s ease;
  }
  .row.user .bubble{
    background:var(--panel-2);
    border:1px solid var(--border);
    border-bottom-right-radius:6px;
  }
  .row.user:hover .bubble{ box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .row.assistant .bubble{
    background:transparent;
    padding:6px 0 6px 2px;
    border-bottom-left-radius:6px;
  }
  .row.error .bubble{
    background:rgba(234,67,53,0.08);
    border:1px solid var(--red);
    color:#f28b82;
    animation:shake .4s var(--ease);
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-4px); }
    75%{ transform:translateX(4px); }
  }

  .cursor{
    display:inline-block;
    width:8px;height:16px;
    background:var(--blue);
    margin-left:2px;
    vertical-align:middle;
    animation:blink 0.9s step-start infinite;
    border-radius:1px;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .typing-dots{
    display:flex;
    gap:5px;
    padding:10px 2px;
  }
  .typing-dots span{
    width:7px;height:7px;border-radius:50%;
    background:var(--blue);
    animation:dotbounce 1s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){ animation-delay:.12s; background:var(--purple); }
  .typing-dots span:nth-child(3){ animation-delay:.24s; background:var(--red); }
  @keyframes dotbounce{
    0%,60%,100%{ transform:translateY(0); opacity:.5; }
    30%{ transform:translateY(-6px); opacity:1; }
  }

  /* ---------- Composer ---------- */
  #composer-wrap{
    padding:10px 18vw 22px;
    flex-shrink:0;
  }
  @media (max-width: 1100px){ #composer-wrap{ padding:10px 6vw 18px; } }
  @media (max-width: 640px){ #composer-wrap{ padding:8px 10px 14px; } }

  #composer{
    display:flex;
    align-items:flex-end;
    gap:10px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:28px;
    padding:8px 8px 8px 20px;
    transition:border-color .2s ease, box-shadow .3s ease;
    position:relative;
  }
  #composer::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:28px;
    padding:1px;
    background:var(--grad);
    background-size:300% 100%;
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    opacity:0;
    transition:opacity .25s ease;
    animation:gradientShift 4s ease infinite;
    pointer-events:none;
  }
  #composer:focus-within::before{ opacity:1; }
  #composer:focus-within{
    box-shadow:0 0 0 1px rgba(66,133,244,0.15), 0 4px 18px rgba(0,0,0,.35);
  }
  #input{
    flex:1;
    background:none;
    border:none;
    color:var(--text);
    padding:10px 0;
    font-size:15px;
    font-family:inherit;
    resize:none;
    max-height:160px;
    outline:none;
  }
  #input::placeholder{ color:var(--text-dim); }

  #sendBtn{
    background:var(--grad);
    background-size:300% 100%;
    background-position:0% 50%;
    border:none;
    width:38px;height:38px;
    border-radius:50%;
    cursor:pointer;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease, opacity .15s ease, background-position .4s ease;
    color:#0b0b0c;
    position:relative;
    overflow:hidden;
  }
  #sendBtn:hover:not(:disabled){ background-position:100% 50%; transform:scale(1.05); }
  #sendBtn:active:not(:disabled){ transform:scale(0.9); }
  #sendBtn:disabled{ opacity:.3; cursor:not-allowed; }
  #sendBtn svg{ width:18px; height:18px; }

  .footnote{
    text-align:center;
    font-size:11px;
    color:var(--text-dim);
    margin-top:10px;
  }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--panel-3); }
</style>
</head>
<body>

<div id="app">

  <div id="sidebarOverlay"></div>

  <!-- ================= Sidebar ================= -->
  <aside id="sidebar">
    <div class="sb-top">
      <button class="hamburger" id="sbToggle" aria-label="Toggle sidebar"><i class="bi bi-list"></i></button>
      <div class="sb-brand">SN Chat</div>
    </div>

    <button class="newchat-btn" id="newChatBtn">
      <i class="bi bi-plus-lg"></i>
      <span>New chat</span>
    </button>

    <div class="sb-section-label">Recent</div>
    <div id="chatList"></div>

    <div class="sb-bottom">
      <div class="sb-link"><i class="bi bi-question-circle"></i><span>Help</span></div>
      <div class="sb-link"><i class="bi bi-clock-history"></i><span>Activity</span></div>
      <div class="sb-link"><i class="bi bi-gear"></i><span>Settings</span></div>
    </div>
  </aside>

  <!-- ================= Main ================= -->
  <div id="main">
    <header>
      <div class="header-left">
        <button class="header-hamburger" id="headerHamburger" aria-label="Open sidebar"><i class="bi bi-list"></i></button>
        <div class="logo d-none d-sm-block">SN Chat</div>
      </div>
      <div class="model-pill"><span class="live-dot"></span>ENDLESS CHAT</div>
    </header>

    <div id="chat">
      <div class="empty-state" id="emptyState">
        <div class="glyph">SN Chat</div>
        <p>Ask anything. Responses stream in as they're generated.</p>
        <div class="suggest-row">
          <button class="suggest-chip" data-prompt="Explain quantum computing simply">Explain a concept</button>
          <button class="suggest-chip" data-prompt="Write a short poem about the ocean">Write something</button>
          <button class="suggest-chip" data-prompt="Give me 5 ideas for a weekend trip">Get ideas</button>
          <button class="suggest-chip" data-prompt="Help me debug my JavaScript code">Debug code</button>
        </div>
      </div>
    </div>

    <div id="composer-wrap">
      <div id="composer">
        <textarea id="input" rows="1" placeholder="Message SN Chat…"></textarea>
        <button id="sendBtn" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L14 20L11 13L4 12Z" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="footnote">SN Chat can make mistakes. Powered by <a href="https://instagram.com/shadowxzz_._king_">SREE SHANTH</a>.</div>
    </div>
  </div>

</div>

<script>
  // ================================================================
  // DEVELOPER ONLY: OpenRouter API key. Users never see or enter this.
  // ================================================================
  const OPENROUTER_API_KEY = "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";
  const MODEL = "openrouter/free";

  const chatEl = document.getElementById('chat');
  const emptyState = document.getElementById('emptyState');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const chatListEl = document.getElementById('chatList');
  const sidebar = document.getElementById('sidebar');
  const sbToggle = document.getElementById('sbToggle');
  const headerHamburger = document.getElementById('headerHamburger');
  const sidebarOverlay = document.getElementById('sidebarOverlay');
  const newChatBtn = document.getElementById('newChatBtn');

  let streamFrame = null;
  let pendingAssistantText = '';
  let resizeFrame = null;

  // ---------------- Conversation management ----------------
  let conversations = [];      // { id, title, messages: [{role, content}] }
  let currentId = null;

  function uid(){ return Math.random().toString(36).slice(2, 10); }

  function getCurrent(){
    return conversations.find(c => c.id === currentId);
  }

  function createConversation(){
    const convo = { id: uid(), title: 'New chat', messages: [] };
    conversations.unshift(convo);
    currentId = convo.id;
    renderChatList();
    renderConversation();
  }

  function renderChatList(){
    chatListEl.innerHTML = '';
    conversations.forEach((c, i) => {
      const item = document.createElement('div');
      item.className = 'chat-item' + (c.id === currentId ? ' active' : '');
      item.style.animationDelay = (i * 0.03) + 's';
      item.innerHTML = `<i class="bi bi-chat-left-text"></i><span class="title"></span><button class="del" title="Delete"><i class="bi bi-trash3"></i></button>`;
      item.querySelector('.title').textContent = c.title;
      item.addEventListener('click', (e) => {
        if (e.target.closest('.del')) return;
        currentId = c.id;
        renderChatList();
        renderConversation();
        closeMobileSidebar();
      });
      item.querySelector('.del').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteConversation(c.id);
      });
      chatListEl.appendChild(item);
    });
  }

  function deleteConversation(id){
    conversations = conversations.filter(c => c.id !== id);
    if (currentId === id){
      if (conversations.length){
        currentId = conversations[0].id;
      } else {
        createConversation();
        return;
      }
    }
    renderChatList();
    renderConversation();
  }

  function renderConversation(){
    const convo = getCurrent();
    chatEl.innerHTML = '';
    if (!convo || convo.messages.length === 0){
      chatEl.appendChild(buildEmptyState());
      return;
    }
    convo.messages.forEach(m => {
      const bubble = addRow(m.role === 'user' ? 'user' : 'assistant');
      bubble.textContent = m.content;
    });
    scrollToBottom();
  }

  function buildEmptyState(){
    const el = document.createElement('div');
    el.className = 'empty-state';
    el.id = 'emptyState';
    el.innerHTML = `
      <div class="glyph">SN Chat</div>
      <p>Ask anything. Responses stream in as they're generated.</p>
      <div class="suggest-row">
        <button class="suggest-chip" data-prompt="Explain quantum computing simply">Explain a concept</button>
        <button class="suggest-chip" data-prompt="Write a short poem about the ocean">Write something</button>
        <button class="suggest-chip" data-prompt="Give me 5 ideas for a weekend trip">Get ideas</button>
        <button class="suggest-chip" data-prompt="Help me debug my JavaScript code">Debug code</button>
      </div>`;
    el.querySelectorAll('.suggest-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        inputEl.value = chip.dataset.prompt;
        resizeInput();
        sendMessage();
      });
    });
    return el;
  }

  // ---------------- Sidebar toggle ----------------
  let sidebarCollapsed = false;
  sbToggle.addEventListener('click', () => {
    sidebarCollapsed = !sidebarCollapsed;
    sidebar.classList.toggle('collapsed', sidebarCollapsed);
  });
  headerHamburger.addEventListener('click', () => {
    sidebar.classList.add('mobile-open');
    sidebarOverlay.classList.add('show');
  });
  sidebarOverlay.addEventListener('click', closeMobileSidebar);
  function closeMobileSidebar(){
    sidebar.classList.remove('mobile-open');
    sidebarOverlay.classList.remove('show');
  }

  // ---------------- Ripple effect ----------------
  function attachRipple(btn){
    btn.addEventListener('click', function(e){
      const rect = btn.getBoundingClientRect();
      const ripple = document.createElement('span');
      const size = Math.max(rect.width, rect.height);
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 550);
    });
  }
  attachRipple(newChatBtn);
  attachRipple(sendBtn);

  newChatBtn.addEventListener('click', () => {
    createConversation();
    closeMobileSidebar();
    inputEl.focus();
  });

  // ---------------- Chat rendering helpers ----------------
  function scrollToBottom(){
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function scheduleBubbleUpdate(bubble, cursor, text){
    pendingAssistantText = text;
    if (streamFrame) return;
    streamFrame = requestAnimationFrame(() => {
      bubble.textContent = pendingAssistantText;
      bubble.appendChild(cursor);
      scrollToBottom();
      streamFrame = null;
    });
  }

  function resizeInput(){
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  }

  function addRow(role){
    const existingEmpty = document.getElementById('emptyState');
    if (existingEmpty) existingEmpty.remove();
    const row = document.createElement('div');
    row.className = 'row ' + role;

    if (role !== 'user'){
      const avatar = document.createElement('div');
      avatar.className = 'avatar ai';
      avatar.textContent = 'S';
      row.appendChild(avatar);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    row.appendChild(bubble);

    if (role === 'user'){
      const avatar = document.createElement('div');
      avatar.className = 'avatar you';
      avatar.textContent = 'Y';
      row.appendChild(avatar);
    }

    chatEl.appendChild(row);
    scrollToBottom();
    return bubble;
  }

  function addTypingIndicator(){
    const row = document.createElement('div');
    row.className = 'row assistant';
    row.id = 'typingRow';
    const avatar = document.createElement('div');
    avatar.className = 'avatar ai';
    avatar.textContent = 'S';
    row.appendChild(avatar);
    const dots = document.createElement('div');
    dots.className = 'typing-dots';
    dots.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(dots);
    chatEl.appendChild(row);
    scrollToBottom();
  }
  function removeTypingIndicator(){
    const r = document.getElementById('typingRow');
    if (r) r.remove();
  }

  // ---------------- Send message ----------------
  async function sendMessage(){
    const text = inputEl.value.trim();
    if (!text) return;

    if (!OPENROUTER_API_KEY || OPENROUTER_API_KEY.includes("PASTE_")){
      addRow('error').textContent = 'No API key configured.';
      return;
    }

    if (!currentId) createConversation();
    const convo = getCurrent();

    addRow('user').textContent = text;
    convo.messages.push({ role:'user', content:text });
    if (convo.messages.length === 1){
      convo.title = text.length > 34 ? text.slice(0, 34) + '…' : text;
      renderChatList();
    }

    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;
    addTypingIndicator();

    try{
      const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method:'POST',
        headers:{
          'Authorization':'Bearer ' + OPENROUTER_API_KEY,
          'Content-Type':'application/json',
          'HTTP-Referer': window.location.href,
          'X-Title':'SN Chat'
        },
        body: JSON.stringify({
          model: MODEL,
          messages:[
            { role:'system', content:'You are a helpful, friendly assistant.' },
            ...convo.messages
          ],
          stream:true
        })
      });

      if (!response.ok || !response.body){
        removeTypingIndicator();
        let msg = 'Request failed: ' + response.status;
        try{ const errData = await response.json(); msg = errData?.error?.message || msg; }catch(e){}
        addRow('error').textContent = msg;
        return;
      }

      removeTypingIndicator();
      const bubble = addRow('assistant');
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      bubble.appendChild(cursor);

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '';
      let buffer = '';

      while(true){
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream:true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines){
          const trimmed = line.trim();
          if (!trimmed.startsWith('data:')) continue;
          const payload = trimmed.slice(5).trim();
          if (payload === '[DONE]') continue;
          try{
            const parsed = JSON.parse(payload);
            const token = parsed.choices?.[0]?.delta?.content;
            if (token){
              fullText += token;
              scheduleBubbleUpdate(bubble, cursor, fullText);
            }
          }catch(e){ /* partial chunk, ignore */ }
        }
      }

      cursor.remove();
      convo.messages.push({ role:'assistant', content: fullText || '(empty response)' });

    }catch(err){
      removeTypingIndicator();
      addRow('error').textContent = 'Network error: ' + err.message;
    }finally{
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  inputEl.addEventListener('input', () => {
    if (resizeFrame) cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(resizeInput);
  });
  resizeInput();
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });
  sendBtn.addEventListener('click', sendMessage);

  document.querySelectorAll('.suggest-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      inputEl.value = chip.dataset.prompt;
      resizeInput();
      sendMessage();
    });
  });

  // ---------------- Init ----------------
  createConversation();
</script>

</body>
</html>
