<!DOCTYPE html>
<html lang="en" data-theme="aurora">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SN Chat</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
/* ============ 4 THEMES ============ */
:root,[data-theme="aurora"]{
  --bg:#131314;--sidebar:#1a1b1c;--panel:#1e1f20;--panel-2:#282a2c;--panel-3:#333537;--border:#3c4043;
  --text:#e3e3e3;--dim:#9aa0a6;--c1:#4285f4;--c2:#a142f4;--c3:#ea4335;--c4:#fbbc05;--onc:#0b0b0c;
  --font:'Google Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--radius:20px;--glow:0 0 0 transparent;--pc:66,133,244;
}
[data-theme="neon"]{
  --bg:#07060f;--sidebar:#0c0a1a;--panel:#110e24;--panel-2:#1a1536;--panel-3:#261e4d;--border:#3a2c7a;
  --text:#e8e6ff;--dim:#8f88c9;--c1:#00f0ff;--c2:#ff2bd6;--c3:#7b5cff;--c4:#f5ff3b;--onc:#07060f;
  --font:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;--radius:6px;--glow:0 0 14px rgba(0,240,255,.45);--pc:0,240,255;
}
[data-theme="sunset"]{
  --bg:#1a0f14;--sidebar:#23141a;--panel:#2b1a20;--panel-2:#38232b;--panel-3:#482d37;--border:#5c3a45;
  --text:#ffeede;--dim:#c9a08f;--c1:#ff7a3d;--c2:#ff3d81;--c3:#ffb84d;--c4:#ffe29a;--onc:#2a0f14;
  --font:Georgia,'Palatino Linotype',serif;--radius:26px;--glow:0 0 16px rgba(255,122,61,.35);--pc:255,140,80;
}
[data-theme="paper"]{
  --bg:#f6f3ec;--sidebar:#ece7db;--panel:#fffdf8;--panel-2:#efe9db;--panel-3:#e2dac6;--border:#d6cdb6;
  --text:#2b2a26;--dim:#7a7565;--c1:#2f7d6b;--c2:#c2603a;--c3:#3a5fc2;--c4:#d9a520;--onc:#fffdf8;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--radius:14px;--glow:0 0 0 transparent;--pc:47,125,107;
}
:root{--grad:linear-gradient(90deg,var(--c1) 0%,var(--c2) 45%,var(--c3) 75%,var(--c4) 100%);--sw:280px;--swc:76px;--ease:cubic-bezier(.2,.7,.3,1);--mx:50%;--my:50%}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;height:100dvh;overflow:hidden;transition:background .5s ease,color .5s ease}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
a{color:var(--c1)}
button{font-family:inherit}

/* ============ EFFECT LAYERS ============ */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#spot{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(520px circle at var(--mx) var(--my),rgba(var(--pc),.10),transparent 60%)}
#themeFlash{position:fixed;z-index:99;border-radius:50%;pointer-events:none;background:var(--c2);opacity:.5;transform:scale(0);animation:flash .8s ease-out forwards}
@keyframes flash{to{transform:scale(60);opacity:0}}
.burst{position:fixed;z-index:100;width:7px;height:7px;border-radius:50%;pointer-events:none;animation:burst .8s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

#app{display:flex;height:100%;width:100%;position:relative;z-index:2}

/* ============ SIDEBAR ============ */
#sidebar{width:var(--sw);flex-shrink:0;background:color-mix(in srgb,var(--sidebar) 88%,transparent);backdrop-filter:blur(14px);display:flex;flex-direction:column;padding:12px 12px 10px;transition:width .28s var(--ease),background .5s;overflow:hidden;position:relative;z-index:20;border-right:1px solid var(--border)}
#sidebar.collapsed{width:var(--swc)}
.sb-top{display:flex;align-items:center;gap:8px;padding:6px 4px 18px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:none;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex-shrink:0;transition:background .15s,transform .3s var(--ease)}
.icon-btn:hover{background:var(--panel-2)}.icon-btn:active{transform:scale(.9)}
.icon-btn i{transition:transform .35s var(--ease)}
#sidebar.collapsed #sbToggle i{transform:rotate(180deg)}
.gtext{background:var(--grad);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gs 8s ease infinite}
@keyframes gs{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.sb-brand{font-size:18px;font-weight:600;white-space:nowrap;transition:opacity .15s}
#sidebar.collapsed .sb-brand{opacity:0;width:0}
.newchat-btn{display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px solid transparent;color:var(--text);border-radius:var(--radius);padding:11px 18px 11px 16px;font-size:14px;font-weight:500;cursor:pointer;width:fit-content;margin:2px 2px 22px;transition:background .2s,box-shadow .2s,transform .2s;position:relative;overflow:hidden;white-space:nowrap}
.newchat-btn:hover{background:var(--panel-3);box-shadow:var(--glow);transform:translateY(-1px)}
.newchat-btn i{font-size:16px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#sidebar.collapsed .newchat-btn{width:44px;padding:11px;justify-content:center;border-radius:50%}
#sidebar.collapsed .newchat-btn span,#sidebar.collapsed .sb-link span,#sidebar.collapsed .chat-item .title,#sidebar.collapsed .chat-item .del{display:none}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(0);animation:rp .55s ease-out;pointer-events:none}
@keyframes rp{to{transform:scale(3);opacity:0}}
.sb-label{font-size:12px;color:var(--dim);font-weight:500;padding:8px 12px 6px;white-space:nowrap}
#sidebar.collapsed .sb-label{opacity:0;height:0;padding:0}
#chatList{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:1px}
.chat-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:calc(var(--radius) - 4px);color:var(--dim);cursor:pointer;font-size:13.5px;white-space:nowrap;overflow:hidden;transition:background .15s,color .15s,transform .15s;animation:itemIn .3s var(--ease) both}
@keyframes itemIn{from{opacity:0;transform:translateX(-8px)}}
.chat-item:hover{background:var(--panel-2);color:var(--text);transform:translateX(3px)}
.chat-item.active{background:var(--panel-2);color:var(--text);box-shadow:inset 3px 0 0 var(--c1)}
.chat-item .title{overflow:hidden;text-overflow:ellipsis;flex:1}
.chat-item .del{opacity:0;background:none;border:none;color:var(--dim);padding:2px 4px;border-radius:6px;transition:.15s}
.chat-item:hover .del{opacity:1}.chat-item .del:hover{color:var(--c3);background:rgba(234,67,53,.12)}
#sidebar.collapsed .chat-item{justify-content:center;padding:9px}
.sb-bottom{border-top:1px solid var(--border);padding-top:8px;display:flex;flex-direction:column;gap:2px}
.sb-link{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:calc(var(--radius) - 4px);color:var(--dim);font-size:13.5px;cursor:pointer;transition:.15s;white-space:nowrap}
.sb-link:hover{background:var(--panel-2);color:var(--text)}
#sidebar.collapsed .sb-link{justify-content:center}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15}
#overlay.show{display:block}
@media(max-width:860px){
  #sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%);transition:transform .3s var(--ease);width:280px!important}
  #sidebar.mobile-open{transform:none}
  #sidebar.collapsed .sb-brand{opacity:1;width:auto}
  #sidebar.collapsed .newchat-btn span,#sidebar.collapsed .sb-link span,#sidebar.collapsed .chat-item .title{display:inline!important}
  #sidebar.collapsed .newchat-btn{width:fit-content;border-radius:var(--radius);padding:11px 18px 11px 16px}
}

/* ============ MAIN ============ */
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
header{padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:10px}
.hl{display:flex;align-items:center;gap:10px}
#hh{display:none}@media(max-width:860px){#hh{display:flex}}
.logo{font-size:20px;font-weight:700;letter-spacing:-.01em}
.hr{display:flex;align-items:center;gap:12px}
.themes{display:flex;gap:8px;padding:6px 10px;background:var(--panel);border:1px solid var(--border);border-radius:30px}
.sw{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .2s var(--ease),border-color .2s;padding:0}
.sw:hover{transform:scale(1.25) rotate(15deg)}
.sw.on{border-color:var(--text);transform:scale(1.15)}
.sw[data-t=aurora]{background:linear-gradient(135deg,#4285f4,#a142f4,#ea4335)}
.sw[data-t=neon]{background:linear-gradient(135deg,#00f0ff,#ff2bd6)}
.sw[data-t=sunset]{background:linear-gradient(135deg,#ff7a3d,#ff3d81)}
.sw[data-t=paper]{background:linear-gradient(135deg,#f6f3ec,#2f7d6b)}
.pill{font-size:12px;color:var(--dim);background:var(--panel);border:1px solid var(--border);padding:5px 12px;border-radius:20px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--c1);box-shadow:0 0 8px var(--c1);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4;transform:scale(.7)}}
@media(max-width:640px){.pill{display:none}}

#chat{flex:1;overflow-y:auto;padding:28px 18vw 20px;display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth;mask-image:linear-gradient(to bottom,transparent 0,#000 24px,#000 calc(100% - 8px),transparent)}
@media(max-width:1100px){#chat{padding:22px 6vw 16px}}@media(max-width:640px){#chat{padding:16px 12px 12px}}
.empty{margin:auto;text-align:center;max-width:480px;animation:fadeUp .6s var(--ease)}
.glyph{font-size:46px;font-weight:700;margin-bottom:10px;filter:drop-shadow(var(--glow));animation:gs 6s ease infinite,float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.empty p{font-size:14px;color:var(--dim);line-height:1.6}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px;perspective:600px}
.chip{border:1px solid var(--border);background:var(--panel);color:var(--dim);padding:9px 16px;border-radius:calc(var(--radius) - 6px);font-size:12.5px;cursor:pointer;transition:transform .15s ease-out,border-color .18s,color .18s,box-shadow .18s;animation:fadeUp .5s var(--ease) both;will-change:transform}
.chip:nth-child(2){animation-delay:.07s}.chip:nth-child(3){animation-delay:.14s}.chip:nth-child(4){animation-delay:.21s}
.chip:hover{border-color:var(--c1);color:var(--text);box-shadow:var(--glow)}

.row{display:flex;gap:12px;padding:14px 4px;animation:pop .45s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97);filter:blur(4px)}}
.row.user{justify-content:flex-end}
.avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:2px;transition:transform .25s var(--ease)}
.avatar.ai{background:var(--grad);background-size:300% 100%;color:var(--onc);animation:gs 6s ease infinite;box-shadow:var(--glow)}
.row.assistant:hover .avatar.ai{transform:scale(1.12) rotate(-6deg)}
.avatar.you{background:var(--panel-2);border:1px solid var(--border);color:var(--dim)}
.bubble{max-width:72ch;padding:12px 16px;border-radius:var(--radius);line-height:1.65;font-size:15px;white-space:pre-wrap;word-wrap:break-word;transition:background .2s,box-shadow .2s,transform .2s}
.row.user .bubble{background:var(--panel-2);border:1px solid var(--border);border-bottom-right-radius:4px}
.row.user:hover .bubble{box-shadow:var(--glow);transform:translateY(-1px)}
.row.assistant .bubble{background:transparent;padding:6px 0 6px 2px}
.row.error .bubble{background:rgba(234,67,53,.08);border:1px solid var(--c3);color:var(--c3);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.cursor{display:inline-block;width:8px;height:16px;background:var(--c1);margin-left:2px;vertical-align:middle;border-radius:1px;box-shadow:0 0 8px var(--c1);animation:blink .9s step-start infinite}
@keyframes blink{50%{opacity:0}}
.dots{display:flex;gap:5px;padding:10px 2px}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--c1);animation:db 1s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.12s;background:var(--c2)}.dots span:nth-child(3){animation-delay:.24s;background:var(--c3)}
@keyframes db{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}

/* ============ COMPOSER ============ */
#cw{padding:10px 18vw 22px;flex-shrink:0}
@media(max-width:1100px){#cw{padding:10px 6vw 18px}}@media(max-width:640px){#cw{padding:8px 10px 14px}}
#composer{display:flex;align-items:flex-end;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:calc(var(--radius) + 8px);padding:8px 8px 8px 20px;transition:box-shadow .3s;position:relative}
#composer::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:var(--grad);background-size:300% 100%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .25s;animation:gs 4s ease infinite;pointer-events:none}
#composer:focus-within::before{opacity:1}
#composer:focus-within{box-shadow:var(--glow),0 4px 18px rgba(0,0,0,.25)}
#input{flex:1;background:none;border:none;color:var(--text);padding:10px 0;font-size:15px;font-family:inherit;resize:none;max-height:160px;outline:none}
#input::placeholder{color:var(--dim)}
#sendBtn{background:var(--grad);background-size:300% 100%;border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .15s,background-position .4s;color:var(--onc);position:relative;overflow:hidden}
#sendBtn:hover:not(:disabled){background-position:100% 50%;transform:scale(1.08) rotate(-8deg);box-shadow:var(--glow)}
#sendBtn:active:not(:disabled){transform:scale(.88)}
#sendBtn:disabled{opacity:.3;cursor:not-allowed}
#sendBtn svg{width:18px;height:18px}
.foot{text-align:center;font-size:11px;color:var(--dim);margin-top:10px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ============ THEME EXTRAS ============ */
[data-theme="neon"] .bubble,[data-theme="neon"] .chip,[data-theme="neon"] .pill,[data-theme="neon"] #composer{text-shadow:0 0 1px rgba(0,240,255,.25)}
[data-theme="neon"] .row.user .bubble{border-color:var(--c1);box-shadow:inset 0 0 12px rgba(0,240,255,.12)}
[data-theme="neon"] body::after{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);opacity:.5}
[data-theme="sunset"] .row.user .bubble{background:linear-gradient(135deg,rgba(255,122,61,.18),rgba(255,61,129,.18));border-color:rgba(255,122,61,.5)}
[data-theme="paper"] #sidebar{box-shadow:2px 0 14px rgba(0,0,0,.05)}
[data-theme="paper"] .row.user .bubble{box-shadow:0 2px 8px rgba(0,0,0,.06)}
[data-theme="paper"] .gtext,[data-theme="paper"] .glyph,[data-theme="paper"] .logo{filter:none}
</style>
</head>
<body>
<canvas id="fx"></canvas><div id="spot"></div>

<div id="app">
  <div id="overlay"></div>
  <aside id="sidebar">
    <div class="sb-top">
      <button class="icon-btn" id="sbToggle" aria-label="Toggle sidebar"><i class="bi bi-list"></i></button>
      <div class="sb-brand gtext">SN Chat</div>
    </div>
    <button class="newchat-btn" id="newChatBtn"><i class="bi bi-plus-lg"></i><span>New chat</span></button>
    <div class="sb-label">Recent</div>
    <div id="chatList"></div>
    <div class="sb-bottom">
      <div class="sb-link"><i class="bi bi-question-circle"></i><span>Help</span></div>
      <div class="sb-link"><i class="bi bi-clock-history"></i><span>Activity</span></div>
      <div class="sb-link"><i class="bi bi-gear"></i><span>Settings</span></div>
    </div>
  </aside>

  <div id="main">
    <header>
      <div class="hl">
        <button class="icon-btn" id="hh" aria-label="Open sidebar"><i class="bi bi-list"></i></button>
        <div class="logo gtext">SN Chat</div>
      </div>
      <div class="hr">
        <div class="themes" role="group" aria-label="Theme">
          <button class="sw" data-t="aurora" title="Aurora" aria-label="Aurora theme"></button>
          <button class="sw" data-t="neon" title="Neon" aria-label="Neon theme"></button>
          <button class="sw" data-t="sunset" title="Sunset" aria-label="Sunset theme"></button>
          <button class="sw" data-t="paper" title="Paper" aria-label="Paper theme"></button>
        </div>
        <div class="pill"><span class="dot"></span>ENDLESS CHAT</div>
      </div>
    </header>
    <div id="chat"></div>
    <div id="cw">
      <div id="composer">
        <textarea id="input" rows="1" placeholder="Message SN Chat…"></textarea>
        <button id="sendBtn" aria-label="Send"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L14 20L11 13L4 12Z" fill="currentColor"/></svg></button>
      </div>
      <div class="foot">SN Chat can make mistakes. Powered by <a href="https://instagram.com/shadowxzz_._king_">SREE SHANTH</a>.</div>
    </div>
  </div>
</div>

<script>
// ⚠ Paste a NEW key here. Anything in a client-side file is visible to every visitor.
// For a public site, route requests through your own small server/proxy instead.
const OPENROUTER_API_KEY = "PASTE_YOUR_NEW_KEY_HERE";
const MODEL = "openrouter/free";

const $ = id => document.getElementById(id);
const chatEl=$('chat'), inputEl=$('input'), sendBtn=$('sendBtn'), chatListEl=$('chatList'),
      sidebar=$('sidebar'), overlay=$('overlay'), newChatBtn=$('newChatBtn');
let streamFrame=null, pendingText='', resizeFrame=null, conversations=[], currentId=null;
const uid=()=>Math.random().toString(36).slice(2,10);
const getCurrent=()=>conversations.find(c=>c.id===currentId);

/* ---------- Themes ---------- */
function setTheme(t, ev){
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on', s.dataset.t===t));
  try{ localStorage.setItem('sn-theme', t); }catch(e){}
  if(ev){ // expanding colour wave from the clicked swatch
    const f=document.createElement('div'); f.id='themeFlash';
    f.style.cssText=`left:${ev.clientX-10}px;top:${ev.clientY-10}px;width:20px;height:20px`;
    document.body.appendChild(f); setTimeout(()=>f.remove(),850);
  }
  setParticleColor();
}
document.querySelectorAll('.sw').forEach(s=>s.addEventListener('click',e=>setTheme(s.dataset.t,e)));

/* ---------- Particle network background ---------- */
const cv=$('fx'), cx=cv.getContext('2d'); let W,H,P=[],pc='66,133,244',mouse={x:-999,y:-999};
function setParticleColor(){ pc=getComputedStyle(document.documentElement).getPropertyValue('--pc').trim()||pc; }
function sizeCanvas(){
  W=cv.width=innerWidth; H=cv.height=innerHeight;
  const n=Math.min(90,Math.floor(W*H/18000)); P=[];
  for(let i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.6+.6});
}
function tick(){
  cx.clearRect(0,0,W,H);
  for(const p of P){
    const dx=p.x-mouse.x, dy=p.y-mouse.y, d=Math.hypot(dx,dy);
    if(d<120){ p.x+=dx/d*1.2; p.y+=dy/d*1.2; }
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1;
    cx.fillStyle=`rgba(${pc},.55)`; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.283); cx.fill();
  }
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
    const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);
    if(d<120){ cx.strokeStyle=`rgba(${pc},${.18*(1-d/120)})`; cx.beginPath(); cx.moveTo(P[i].x,P[i].y); cx.lineTo(P[j].x,P[j].y); cx.stroke(); }
  }
  requestAnimationFrame(tick);
}
addEventListener('resize',sizeCanvas);
addEventListener('pointermove',e=>{
  mouse.x=e.clientX; mouse.y=e.clientY;
  document.documentElement.style.setProperty('--mx',e.clientX+'px');
  document.documentElement.style.setProperty('--my',e.clientY+'px');
});

/* ---------- Send-button burst ---------- */
function burst(el){
  const r=el.getBoundingClientRect(), cs=['--c1','--c2','--c3','--c4'].map(v=>getComputedStyle(document.documentElement).getPropertyValue(v));
  for(let i=0;i<14;i++){
    const b=document.createElement('span'), a=Math.random()*6.283, d=40+Math.random()*50;
    b.className='burst'; b.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;background:${cs[i%4]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;
    document.body.appendChild(b); setTimeout(()=>b.remove(),850);
  }
}

/* ---------- 3D tilt on chips ---------- */
function attachTilt(el){
  el.addEventListener('pointermove',e=>{
    const r=el.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    el.style.transform=`rotateY(${x*18}deg) rotateX(${-y*18}deg) translateY(-2px)`;
  });
  el.addEventListener('pointerleave',()=>el.style.transform='');
}

/* ---------- Conversations ---------- */
function createConversation(){
  conversations.unshift({id:uid(),title:'New chat',messages:[]}); currentId=conversations[0].id;
  renderChatList(); renderConversation();
}
function renderChatList(){
  chatListEl.innerHTML='';
  conversations.forEach((c,i)=>{
    const item=document.createElement('div');
    item.className='chat-item'+(c.id===currentId?' active':''); item.style.animationDelay=(i*.03)+'s';
    item.innerHTML='<i class="bi bi-chat-left-text"></i><span class="title"></span><button class="del" title="Delete"><i class="bi bi-trash3"></i></button>';
    item.querySelector('.title').textContent=c.title;
    item.addEventListener('click',e=>{ if(e.target.closest('.del'))return; currentId=c.id; renderChatList(); renderConversation(); closeMobile(); });
    item.querySelector('.del').addEventListener('click',e=>{ e.stopPropagation(); deleteConversation(c.id); });
    chatListEl.appendChild(item);
  });
}
function deleteConversation(id){
  conversations=conversations.filter(c=>c.id!==id);
  if(currentId===id){ if(conversations.length) currentId=conversations[0].id; else { createConversation(); return; } }
  renderChatList(); renderConversation();
}
function renderConversation(){
  const convo=getCurrent(); chatEl.innerHTML='';
  if(!convo||!convo.messages.length){ chatEl.appendChild(buildEmpty()); return; }
  convo.messages.forEach(m=>{ addRow(m.role==='user'?'user':'assistant').textContent=m.content; });
  scrollToBottom();
}
function buildEmpty(){
  const el=document.createElement('div'); el.className='empty'; el.id='emptyState';
  el.innerHTML=`<div class="glyph gtext">SN Chat</div><p>Ask anything. Responses stream in as they're generated.</p>
  <div class="chips">
    <button class="chip" data-p="Explain quantum computing simply">Explain a concept</button>
    <button class="chip" data-p="Write a short poem about the ocean">Write something</button>
    <button class="chip" data-p="Give me 5 ideas for a weekend trip">Get ideas</button>
    <button class="chip" data-p="Help me debug my JavaScript code">Debug code</button></div>`;
  el.querySelectorAll('.chip').forEach(c=>{ attachTilt(c); c.addEventListener('click',()=>{ inputEl.value=c.dataset.p; resizeInput(); sendMessage(); }); });
  return el;
}

/* ---------- Sidebar ---------- */
$('sbToggle').addEventListener('click',()=>sidebar.classList.toggle('collapsed'));
$('hh').addEventListener('click',()=>{ sidebar.classList.add('mobile-open'); overlay.classList.add('show'); });
overlay.addEventListener('click',closeMobile);
function closeMobile(){ sidebar.classList.remove('mobile-open'); overlay.classList.remove('show'); }
function attachRipple(btn){
  btn.addEventListener('click',e=>{
    const r=btn.getBoundingClientRect(), s=Math.max(r.width,r.height), rp=document.createElement('span');
    rp.className='ripple'; rp.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;
    btn.appendChild(rp); setTimeout(()=>rp.remove(),550);
  });
}
attachRipple(newChatBtn); attachRipple(sendBtn);
newChatBtn.addEventListener('click',()=>{ createConversation(); closeMobile(); inputEl.focus(); });

/* ---------- Chat helpers ---------- */
const scrollToBottom=()=>{ chatEl.scrollTop=chatEl.scrollHeight; };
function scheduleUpdate(bubble,cursor,text){
  pendingText=text; if(streamFrame)return;
  streamFrame=requestAnimationFrame(()=>{ bubble.textContent=pendingText; bubble.appendChild(cursor); scrollToBottom(); streamFrame=null; });
}
function resizeInput(){ inputEl.style.height='auto'; inputEl.style.height=Math.min(inputEl.scrollHeight,160)+'px'; }
function addRow(role){
  const ex=$('emptyState'); if(ex)ex.remove();
  const row=document.createElement('div'); row.className='row '+role;
  const av=(cls,t)=>{ const a=document.createElement('div'); a.className='avatar '+cls; a.textContent=t; return a; };
  if(role!=='user') row.appendChild(av('ai','S'));
  const bubble=document.createElement('div'); bubble.className='bubble'; row.appendChild(bubble);
  if(role==='user') row.appendChild(av('you','Y'));
  chatEl.appendChild(row); scrollToBottom(); return bubble;
}
function addTyping(){
  const row=document.createElement('div'); row.className='row assistant'; row.id='typingRow';
  row.innerHTML='<div class="avatar ai">S</div><div class="dots"><span></span><span></span><span></span></div>';
  chatEl.appendChild(row); scrollToBottom();
}
const removeTyping=()=>{ const r=$('typingRow'); if(r)r.remove(); };

/* ---------- Send ---------- */
async function sendMessage(){
  const text=inputEl.value.trim(); if(!text)return;
  if(!OPENROUTER_API_KEY||OPENROUTER_API_KEY.includes('PASTE_')){ addRow('error').textContent='No API key configured.'; return; }
  burst(sendBtn);
  if(!currentId)createConversation();
  const convo=getCurrent();
  addRow('user').textContent=text; convo.messages.push({role:'user',content:text});
  if(convo.messages.length===1){ convo.title=text.length>34?text.slice(0,34)+'…':text; renderChatList(); }
  inputEl.value=''; inputEl.style.height='auto'; sendBtn.disabled=true; addTyping();
  try{
    const res=await fetch('https://openrouter.ai/api/v1/chat/completions',{
      method:'POST',
      headers:{'Authorization':'Bearer '+OPENROUTER_API_KEY,'Content-Type':'application/json','HTTP-Referer':location.href,'X-Title':'SN Chat'},
      body:JSON.stringify({model:MODEL,messages:[{role:'system',content:'You are a helpful, friendly assistant.'},...convo.messages],stream:true})
    });
    if(!res.ok||!res.body){
      removeTyping(); let msg='Request failed: '+res.status;
      try{ const d=await res.json(); msg=d?.error?.message||msg; }catch(e){}
      addRow('error').textContent=msg; return;
    }
    removeTyping();
    const bubble=addRow('assistant'), cursor=document.createElement('span'); cursor.className='cursor'; bubble.appendChild(cursor);
    const reader=res.body.getReader(), dec=new TextDecoder(); let full='', buf='';
    while(true){
      const {done,value}=await reader.read(); if(done)break;
      buf+=dec.decode(value,{stream:true}); const lines=buf.split('\n'); buf=lines.pop();
      for(const line of lines){
        const t=line.trim(); if(!t.startsWith('data:'))continue;
        const payload=t.slice(5).trim(); if(payload==='[DONE]')continue;
        try{ const tok=JSON.parse(payload).choices?.[0]?.delta?.content; if(tok){ full+=tok; scheduleUpdate(bubble,cursor,full); } }catch(e){}
      }
    }
    cursor.remove(); convo.messages.push({role:'assistant',content:full||'(empty response)'});
  }catch(err){
    removeTyping(); addRow('error').textContent='Network error: '+err.message;
  }finally{ sendBtn.disabled=false; inputEl.focus(); }
}
inputEl.addEventListener('input',()=>{ if(resizeFrame)cancelAnimationFrame(resizeFrame); resizeFrame=requestAnimationFrame(resizeInput); });
inputEl.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMessage(); } });
sendBtn.addEventListener('click',sendMessage);

/* ---------- Init ---------- */
let saved='aurora'; try{ saved=localStorage.getItem('sn-theme')||'aurora'; }catch(e){}
setTheme(saved); sizeCanvas(); tick(); createConversation();
</script>
